name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt

    - name: Run tests
      run: |
        python -m pytest -v

    - name: Test summary
      if: always()
      run: |
        echo "Tests completed. Check logs above for results."

  # ==================== CD: Build & push Docker image ====================
  # Runs ONLY after 'test' passes (needs: test), and ONLY on a push to main
  # (not on pull requests, not on develop). This keeps the registry clean —
  # only tested, main-branch code becomes a published image.
  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection-api:latest
        # Cache layers between runs so rebuilds are faster (don't re-download
        # every dependency each time).
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==================== CD: Deploy to EC2 ====================
  # Runs ONLY after 'docker' pushes the new image, and ONLY on main.
  # SSHes into the EC2 box, pulls the fresh image, and restarts the
  # container. This is the last mile: git push -> live server, fully auto.
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to EC2 over SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull the freshly-built image from Docker Hub
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection-api:latest
          # Stop & remove the old container (|| true so it doesn't fail if none exists yet)
          sudo docker stop fraud-api || true
          sudo docker rm fraud-api || true
          # Start the new container on port 80
          sudo docker run -d --name fraud-api -p 80:8000 ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection-api:latest
          # Clean up old dangling images so the small EC2 disk doesn't fill up
          sudo docker image prune -f
